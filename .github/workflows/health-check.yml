name: BeLiquid Pipeline Health Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/health-check.yml'
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: beliquid-pipeline-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: Validate Python pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Python version
        run: python --version

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Discover and enrich DEX Screener token profiles
        env:
          PYTHONPATH: src
        run: python -m beliquid.sources.enrichment

      - name: Run pipeline health check
        env:
          PYTHONPATH: src
        run: python -m beliquid.main

      - name: Generate safeguard-first human research queue
        env:
          PYTHONPATH: src
        run: python -m beliquid.research_queue --input artifacts/prospect-review.json --output-dir artifacts

      - name: Validate review inputs, CSV/JSON parity, and audit provenance
        env:
          PYTHONPATH: src
        run: python -m beliquid.validate_review_batch --artifacts-dir artifacts --write-manifest

      - name: Generate controlled pilot-validation report
        env:
          PYTHONPATH: src
        run: python -m beliquid.pilot_validation --artifacts-dir artifacts

      - name: Upload complete prospect review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beliquid-prospect-review-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Record run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## BeLiquid Pipeline Health Check"
            echo ""
            echo "- Run number: ${RUN_NUMBER}"
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Job status: ${JOB_STATUS}"
            echo "- Python: 3.12"
            echo "- Discovery source: DEX Screener latest token profiles"
            echo "- Discovery/enrichment/qualification summary: emitted by the source step above"
            echo "- Runtime health check: validates Python runtime only; its zero discovery counts are not batch totals"
            echo "- Full-batch review export: prospect-review.csv, prospect-review.json, research-queue.csv, research-queue.json, pipeline-summary.json, audit-manifest.json (artifact retention: 14 days)"
            echo "- Review validation: checks reviewer inputs against the current batch, reconciles CSV/JSON fields, and records input/output SHA-256 hashes"
            echo "- Research queue: manual holds first; identity/risk verification precedes commercial research; no outreach"
            echo "- Market research priority: heuristic labels only; not a qualification score or buying-intent claim"
            echo "- Qualification scores: withheld until criterion-level evidence is reviewed"
            echo "- Automated outreach: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
