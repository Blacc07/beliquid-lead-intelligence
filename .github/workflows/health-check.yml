name: BeLiquid Pipeline Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: beliquid-pipeline-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: Validate Python pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python version
        run: python --version

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run pipeline health check
        env:
          PYTHONPATH: src
        run: python -m beliquid.main

      - name: Record run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## BeLiquid Pipeline Health Check"
            echo ""
            echo "- Run number: ${RUN_NUMBER}"
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Job status: ${JOB_STATUS}"
            echo "- Python: 3.12"
          } >> "$GITHUB_STEP_SUMMARY"
